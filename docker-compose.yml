# =============================================================================
# SmartPYQ Docker Compose - Production Configuration
# =============================================================================

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smartpyq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartpyq
      POSTGRES_USER: smartpyq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    
  # Database Backup
  backup:
    image: postgres:16-alpine
    container_name: smartpyq-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: smartpyq
      PGUSER: smartpyq
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      backup_data:
    driver: local
volumes:
      - backup_data:/backups
    entrypoint: /bin/sh
    command: -c "trap forever SIGTERM; while true; do pg_dump -Fc > /backups/smartpyq_$(date +\%Y\%m\%d_\%H\%M\%S).dump && find /backups -name '*.dump' -mtime +7 -delete; sleep 86400 & wait $$; done"
volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpyq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartpyq-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SmartPYQ Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpyq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: production
      DEBUG: "false"
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://smartpyq:${POSTGRES_PASSWORD:-changeme_in_production}@postgres:5432/smartpyq
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: question-papers
      USE_SUPABASE_STORAGE: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
