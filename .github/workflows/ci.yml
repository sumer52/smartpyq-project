name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          ENV: test
          JWT_SECRET: ci-only-secret-key-0123456789abcdef0123456789abcdef
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartpyq-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smartpyq-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings 999

      - name: Production build
        run: npm run build

  intro-e2e:
    name: Intro E2E (CDP harness)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smartpyq-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: smartpyq-frontend
        run: npm ci

      - name: Production build
        working-directory: smartpyq-frontend
        env:
          # A production bundle throws at runtime without this (backendUrl.js
          # assertBackendConfigured). CI has no .env, so mirror production.
          VITE_BACKEND_URL: https://smartpyq-backend.onrender.com
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness dependency
        run: pip install websockets

      - name: Ensure Chrome is installed
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Export Chrome path
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Preflight diagnostics
        run: |
          echo "::notice title=CI preflight::chrome=$([ -n "$CHROME_PATH" ] && echo set || echo unset) exists=$([ -n "$CHROME_PATH" ] && [ -x "$CHROME_PATH" ] && echo yes || echo no)"
          [ -n "$CHROME_PATH" ] && [ -x "$CHROME_PATH" ] || { echo "::error title=Chrome not available::CHROME_PATH=$CHROME_PATH"; exit 1; }

      - name: Serve dist and run intro validation (29 checks)
        id: intro
        run: |
          mkdir -p tmp
          python serve_dist.py 5175 > tmp/serve_dist.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5175/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5175/ > /dev/null || { echo "server did not start"; cat tmp/serve_dist.log; exit 1; }
          python intro_check.py http://127.0.0.1:5175
          HARNESS_EXIT=$?
          kill $SERVER_PID || true
          [ $HARNESS_EXIT -eq 0 ] || exit $HARNESS_EXIT

      - name: Job summary
        if: always() && steps.intro.outcome == 'failure'
        run: cat tmp/intro_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload intro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intro-screenshots
          path: |
            tmp/*.png
            tmp/intro_results.json
            tmp/serve_dist.log
          if-no-files-found: ignore
          retention-days: 7

  devtools-check:
    name: DevTools policy guard
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smartpyq-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: smartpyq-frontend
        run: npm ci

      - name: Production build
        working-directory: smartpyq-frontend
        env:
          VITE_BACKEND_URL: https://smartpyq-backend.onrender.com
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness dependency
        run: pip install websockets

      - name: Ensure Chrome is installed
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Export Chrome path
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Serve dist and run DevTools policy guard (source + runtime)
        id: devtools
        run: |
          mkdir -p tmp
          python serve_dist.py 5176 > tmp/serve_dist.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5176/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5176/ > /dev/null || { echo "server did not start"; cat tmp/serve_dist.log; exit 1; }
          python devtools_check.py http://127.0.0.1:5176
          HARNESS_EXIT=$?
          kill $SERVER_PID || true
          [ $HARNESS_EXIT -eq 0 ] || exit $HARNESS_EXIT

      - name: Job summary
        if: always() && steps.devtools.outcome == 'failure'
        run: cat tmp/devtools_summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload guard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devtools-guard-results
          path: |
            tmp/devtools_results.json
            tmp/devtools_summary.md
          if-no-files-found: ignore
          retention-days: 7
