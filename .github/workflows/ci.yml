name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          ENV: test
          JWT_SECRET: ci-only-secret-key-0123456789abcdef0123456789abcdef
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartpyq-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smartpyq-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings 999

      - name: Production build
        run: npm run build

  intro-e2e:
    name: Intro E2E (CDP harness)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smartpyq-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: smartpyq-frontend
        run: npm ci

      - name: Production build
        working-directory: smartpyq-frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness dependency
        run: pip install websockets

      - name: Ensure Chrome is installed
        uses: browser-actions/setup-chrome@v1
        with:
          id: chrome

      - name: Export Chrome path
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Serve dist on :5175
        run: |
          python serve_dist.py 5175 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5175/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5175/ > /dev/null || { echo "server did not start"; exit 1; }

      - name: Run intro validation (29 checks)
        run: python intro_check.py http://127.0.0.1:5175

      - name: Upload intro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intro-screenshots
          path: |
            tmp/*.png
            tmp/intro_results.json
          if-no-files-found: ignore
          retention-days: 7
