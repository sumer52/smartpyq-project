# =============================================================================
# SmartPYQ CI Pipeline
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # Backend tests
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartpyq_test
          POSTGRES_USER: smartpyq
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartpyq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          python -m flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          python -m flake8 app/ --count --max-complexity=10 --max-line-length=127 --statistics || true

      - name: Run tests
        env:
          ENV: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: test-secret-key-for-ci-only-32chars!!
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          USE_SUPABASE_STORAGE: "false"
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # Frontend build
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: smartpyq-frontend/package-lock.json

      - name: Install dependencies
        working-directory: smartpyq-frontend
        run: npm ci

      - name: Build frontend
        working-directory: smartpyq-frontend
        run: npm run build

      - name: Run lint
        working-directory: smartpyq-frontend
        run: npm run lint || true

  # Security checks
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check for secrets in code
        run: |
          echo "Checking for hardcoded secrets..."
          ! grep -r "password\s*=\s*['\"]" app/ --include="*.py" || true
          ! grep -r "secret\s*=\s*['\"]" app/ --include="*.py" || true
          ! grep -r "api_key\s*=\s*['\"]" app/ --include="*.py" || true
          echo "Secret scan complete"

      - name: Check dependencies for vulnerabilities
        run: |
          pip install safety || true
          safety check -r requirements.txt || true

  # Docker build
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: smartpyq:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
