<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartPYQ -  Previous Year Papers with AI-powered study assistance. Access, analyze, and excel with intelligent question paper platform." />
    <meta name="keywords" content="previous year papers, PYQ, AI study assistant, education, exam preparation, student platform" />
    <meta name="author" content="SmartPYQ Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smartpyq.com/" />
    <meta property="og:title" content="SmartPYQ - Intelligent Previous Year Papers Platform" />
    <meta property="og:description" content="Previous Year Papers with AI-powered study assistance" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://smartpyq.com/" />
    <meta property="twitter:title" content="SmartPYQ - Intelligent Previous Year Papers Platform" />
    <meta property="twitter:description" content=" Previous Year Papers with AI-powered study assistance" />
    
    <!-- Accessibility -->
    <meta name="theme-color" content="#0b0620" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the API origin so the first XHR skips DNS+TLS (~100-300ms) -->
    <link rel="preconnect" href="https://smartpyq-backend.onrender.com" crossorigin />
    <!-- Intro background + logo are the first-visit LCP candidates; start
         them in parallel with the JS bundle instead of waiting for React. -->
    <link rel="preload" as="image" href="/intro-background.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/logo.webp" />
    <!-- Brand typography: Sora (display) + Inter (body), swap for fast FCP.
         Loaded asynchronously so font CSS never blocks first paint; the
         text renders immediately in the fallback stack and swaps in. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <title>SmartPYQ - Intelligent Previous Year Papers Platform</title>
  </head>
  <body>
    <!-- Static splash: paints the intro's dark brand frame + logo frame
         instantly (no JS), so first-visit visitors never stare at a blank
         screen while the bundle parses. React swaps it out via [data-app-ready]
         once the real intro is mounted (main.jsx) — see app:ready handshake. -->
    <div id="splash" aria-hidden="true">
      <style>
        #splash { position: fixed; inset: 0; z-index: 9999; background: #05020d;
          display: flex; align-items: center; justify-content: center; }
        #splash img { width: min(42vw, 300px); opacity: .92; }
        [data-app-ready] #splash { display: none; }
        @media (prefers-reduced-motion: reduce) { #splash { display: none; } }
      </style>
      <img src="/logo-128.webp" alt="" width="128" height="85" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
