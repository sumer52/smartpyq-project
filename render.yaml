services:
  - type: web
    name: smartpyq-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: smartpyq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DEV_EMAIL_LOG_OTP
        value: false
    healthCheckPath: /health

databases:
  - name: smartpyq-db
    plan: free
    databaseName: smartpyq
    ipAllowList: []
