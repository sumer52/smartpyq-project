services:
  - type: web
    name: smartpyq-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: smartpyq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DEV_EMAIL_LOG_OTP
        value: false

databases:
  - name: smartpyq-db
    plan: free
    databaseName: smartpyq
    ipAllowList: []
