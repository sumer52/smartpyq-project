services:
  - type: web
    name: smartpyq-backend
    runtime: python
    plan: free
    healthCheckPath: /health
    # Pin Python 3.12: prebuilt wheels exist for every dependency in requirements.txt
    # (PyMuPDF, asyncpg, cryptography, Pillow, aiohttp). Newer Pythons force
    # source compilation of PyMuPDF and fail the build.
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Migrations + demo-account seed, then bind 0.0.0.0:$PORT for Render
    startCommand: alembic upgrade head && python -m app.scripts.seed_demo_user && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: smartpyq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Supabase (private file storage) — all values set in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: question-papers
      - key: USE_SUPABASE_STORAGE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: DEV_EMAIL_LOG_OTP
        value: false

databases:
  - name: smartpyq-db
    plan: free
    databaseName: smartpyq
    ipAllowList: []
